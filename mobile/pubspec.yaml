name: inventory_mobile
description: "Aplicación móvil de inventario asistido por visión artificial (Solgar Colombia / Innovate Nutrition)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
